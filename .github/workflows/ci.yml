name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Simulation tests
        run: dotnet test tests/Ashfall.Sim.Tests
      - name: Compile Godot C# project
        run: dotnet build game/Ashfall.csproj
